<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZettaBrain Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; margin-bottom: 1.5rem; }
        .features { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 500px; margin: 0 auto; }
        .feature { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; text-align: left; }
        .feature h3 { color: #6366f1; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .feature span { color: #94a3b8; font-size: 0.8rem; }
        .api-link { margin-top: 2rem; }
        .api-link a { color: #6366f1; text-decoration: none; font-size: 0.9rem; }
        .api-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZettaBrain Platform</h1>
        <p>Unified Conversational + Generative AI</p>
        <div class="features">
            <div class="feature">
                <h3>Chat</h3>
                <span>RAG-powered Q&A against team documents</span>
            </div>
            <div class="feature">
                <h3>Generate</h3>
                <span>Skill-based document generation</span>
            </div>
            <div class="feature">
                <h3>Teams</h3>
                <span>Multi-tenant access control</span>
            </div>
            <div class="feature">
                <h3>Verified</h3>
                <span>Cryptographic answer provenance</span>
            </div>
        </div>
        <div class="api-link">
            <a href="/api/docs">API Documentation →</a>
        </div>
    </div>
</body>
</html>
