[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettabrain-platform"
version = "0.3.0"
description = "Unified AI platform — conversational RAG + generative document skills with multi-tenant access control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ZettaBrain", email = "hello@zettabrain.ai" }]
dependencies = [
    # Core (same as zettabrain-teams)
    "zettabrain-rag",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "sqlmodel>=0.0.19",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "ldap3>=2.9.1",
    # Cloud LLM providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    # Direct LLM access (for generation streaming)
    "httpx>=0.25.0",
    # Document handling (generation output)
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
    # Skill parsing
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
    # SOC2 utilities
    "cryptography>=41.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
]
groq = []
together = []
bedrock = ["boto3>=1.34.0"]

[project.scripts]
zettabrain-platform = "zettabrain_platform.cli:main"
zettabrain-platform-setup = "zettabrain_platform.cli:setup"
zbp = "zettabrain_platform.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zettabrain_platform*"]

[tool.setuptools.package-data]
"zettabrain_platform" = ["static/**/*", "scripts/*", "skills/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
